name: Patch checkout RPC

on:
  push:
    branches:
      - audit/post-migration-hardening-2026-09-07

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'security: route checkout through secure RPC'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/post-migration-hardening-2026-09-07
          fetch-depth: 0

      - name: Replace checkout block exactly once
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/routes/index.tsx')
          text = path.read_text()
          old = """  const submitOrder = useCallback(async (form: CheckoutForm, deliveryFee: number) => {
            if (!restaurant || cart.length === 0) return
            if (!restaurant.is_open) { alert('O restaurante está fechado no momento. Tente novamente mais tarde.'); return }
            setSubmitting(true)
            try {
              const total = cartSubtotal + deliveryFee
              const { data: sd } = await supabase.auth.getSession()
              if (!sd.session) { const { error: ae } = await supabase.auth.signInAnonymously(); if (ae) throw ae }
              let notes = form.notes || ''
              if (form.payment_method === 'cash' && form.change_for.trim()) {
                const t = `Troco para: R$ ${form.change_for}`; notes = notes ? `${t} | ${notes}` : t
              }
              const { data: od, error: oe } = await supabase.from('orders').insert({
                restaurant_id: restaurant.id, customer_name: form.customer_name, customer_phone: form.customer_phone,
                address: form.address, neighborhood: form.neighborhood || null, payment_method: form.payment_method,
                status: 'pending', total, delivery_fee: deliveryFee, notes: notes || null,
              }).select('id').single()
              if (oe) throw oe
              const items = cart.map(i => ({
                order_id: od.id, product_id: i.product.id,
                product_name: i.addons.length > 0 ? `${i.product.name} (+ ${i.addons.map(a => a.name).join(', ')})` : i.product.name,
                quantity: i.quantity, unit_price: itemUnitPrice(i),
              }))
              const { error: ie } = await supabase.from('order_items').insert(items)
              if (ie) throw ie
              setCart([])
              setCheckoutOpen(false)
              setOrderConfirmed({ id: od.id, total, deliveryFee })
            } catch (err: any) {
              alert(`Erro ao fazer pedido: ${err.message || 'Tente novamente.'}`)
            } finally { setSubmitting(false) }
          }, [restaurant, cart, cartSubtotal])
          """
          new = """  const submitOrder = useCallback(async (form: CheckoutForm, _deliveryFee: number) => {
            if (!restaurant || cart.length === 0) return
            if (!restaurant.is_open) { alert('O restaurante está fechado no momento. Tente novamente mais tarde.'); return }
            setSubmitting(true)
            try {
              const { data: sd } = await supabase.auth.getSession()
              if (!sd.session) { const { error: ae } = await supabase.auth.signInAnonymously(); if (ae) throw ae }
              let notes = form.notes || ''
              if (form.payment_method === 'cash' && form.change_for.trim()) {
                const t = `Troco para: R$ ${form.change_for}`; notes = notes ? `${t} | ${notes}` : t
              }
              const rpcItems = cart.map(i => ({
                product_id: i.product.id,
                quantity: i.quantity,
                addon_ids: i.addons.map(a => a.id),
              }))
              const { data, error } = await supabase.rpc('create_order', {
                p_restaurant_id: restaurant.id,
                p_customer_name: form.customer_name,
                p_customer_phone: form.customer_phone,
                p_address: form.address,
                p_neighborhood: form.neighborhood || '',
                p_payment_method: form.payment_method,
                p_notes: notes || '',
                p_items: rpcItems,
              })
              if (error) throw error
              const result = data as { order_id: string; total: number | string; delivery_fee: number | string }
              const total = Number(result.total)
              const deliveryFee = Number(result.delivery_fee)
              if (!result.order_id || !Number.isFinite(total) || !Number.isFinite(deliveryFee)) throw new Error('Resposta inválida ao criar pedido.')
              setCart([])
              setCheckoutOpen(false)
              setOrderConfirmed({ id: result.order_id, total, deliveryFee })
            } catch (err: any) {
              alert(`Erro ao fazer pedido: ${err.message || 'Tente novamente.'}`)
            } finally { setSubmitting(false) }
          }, [restaurant, cart])
          """

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one checkout block, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit checkout RPC change
        run: |
          git config user.name "Evandro Bueno"
          git config user.email "arcturusevandro@gmail.com"
          git add src/routes/index.tsx
          git commit -m "security: route checkout through secure RPC"
          git push origin HEAD:audit/post-migration-hardening-2026-09-07
