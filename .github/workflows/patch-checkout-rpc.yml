name: Patch checkout RPC

on:
  push:
    branches:
      - audit/post-migration-hardening-2026-09-07

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: trigger safe checkout RPC patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/post-migration-hardening-2026-09-07
          fetch-depth: 0
      - run: python scripts/patch-checkout-rpc.py
      - run: |
          git config user.name "Evandro Bueno"
          git config user.email "arcturusevandro@gmail.com"
          git add src/routes/index.tsx
          git diff --cached --quiet && exit 1
          git commit -m "security: route checkout through secure RPC"
          git push origin HEAD:audit/post-migration-hardening-2026-09-07
