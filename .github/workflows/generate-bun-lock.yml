name: Generate Bun Lockfile

on:
  push:
    branches:
      - audit/post-migration-hardening-2026-09-07

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Generate lockfile
        run: bun install

      - name: Commit lockfile when missing
        run: |
          if git ls-files --error-unmatch bun.lock >/dev/null 2>&1; then
            echo "bun.lock already tracked"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          git commit -m "chore: commit Bun lockfile"
          git push
