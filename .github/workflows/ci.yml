name: CI

on:
  push:
    branches:
      - main
      - refactor/blink-ui-migration
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint:types

      - name: JavaScript lint
        run: bun run lint:js

      - name: CSS variable checks
        run: bun run check:css-vars

      - name: CSS class checks
        run: bun run check:css-classes

      - name: Build
        run: bun run build
