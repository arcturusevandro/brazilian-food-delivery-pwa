name: CI

on:
  push:
    branches:
      - main
      - refactor/blink-ui-migration
      - audit/post-migration-hardening-2026-09-07
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint:types

      - name: JavaScript lint
        run: bun run lint:js

      - name: CSS lint
        run: bun run lint:css

      - name: Service worker syntax
        run: bun run lint:sw

      - name: Build
        run: bun run build
